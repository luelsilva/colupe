services:

  # ── API ─────────────────────────────────────────────────────────────────────
  colupe-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: colupe-api
    restart: unless-stopped
    ports:
      - "3333:3333"
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      PORT: 3333
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3333/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── WEB / PWA ───────────────────────────────────────────────────────────────
  colupe-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: colupe-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
    depends_on:
      colupe-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── CLOUDFLARE TUNNEL ───────────────────────────────────────────────────────
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: colupe-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
